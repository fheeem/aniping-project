spring:
  application:
    name: AnipingApp
  # ===============================
  # = DATASOURCE
  # ===============================
#  datasource:
#    # DB 연결 정보 (url, username, password는 실제 환경에 맞게 수정하세요)
#    url: jdbc:mysql://localhost:3306/[데이터베이스명]?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
#    username: [사용자명]
#    password: [비밀번호]
#    driver-class-name: com.mysql.cj.jdbc.Driver
  # ===============================
  # = JPA (Hibernate)
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
