spring:
  application:
    name: AnipingApp
  config:
    import: optional:classpath:secret.properties
    
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${oauth.google.clientId} # GCP에서 발급받은 클라이언트 ID
            client-secret: ${oauth.google.secret} # GCP에서 발급받은 클라이언트 보안 비밀번호
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
          kakao:
            client-id: ${oauth.kakao.clientId}
            client-secret: ${oauth.kakao.secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${oauth.google.clientId} # GCP에서 발급받은 클라이언트 ID
            client-secret: ${oauth.google.secret} # GCP에서 발급받은 클라이언트 보안 비밀번호
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # ===============================
  # = Database (MySQL) 추가됨
  # ===============================
  #  datasource:
  #    driver-class-name: com.mysql.cj.jdbc.Driver
  #    # 로컬 환경 기준이며, AWS RDS 사용 시 주소를 해당 엔드포인트로 변경하세요.
  #    url: jdbc:mysql://localhost:3307/aniping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  #    username: root        # 혹은 ${db.username}
  #    password: ${db.password} # secret.properties에 정의 권장
  datasource:
    # localhost 대신 AWS EC2의 퍼블릭 IP와 우리가 설정한 포트(3307)를 적습니다.
    url: jdbc:mysql://3.36.75.243:3307/aniping?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ===============================
  # = JPA (Hibernate)
  # ===============================
  jpa:
    hibernate:
      # 개발 초기에는 update, 운영 시에는 validate 혹은 none을 권장합니다.
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      format_sql: true
    show-sql: true
    # MySQL의 방언(Dialect)을 명시적으로 설정 (선택 사항)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true

  # ===============================
  # = AWS S3 (Spring Cloud AWS 3.x)
  # ===============================
  cloud:
    aws:
      credentials:
        access-key: ${aws.accessKey}
        secret-key: ${aws.secretKey}
      region:
        static: ap-northeast-2
      s3:
        bucket: anipingapp-imagestorege
      stack:
        auto: false

  # ===============================
  # = MAIL
  # ===============================

  mail:
    host: smtp.gmail.com
    port: 587
    username: dbtmzp1@gmail.com
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      hibernate:
        format_sql: true
    auth-code-expiration-millis: 1800000
    jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  # 파일 업로드 용량 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

