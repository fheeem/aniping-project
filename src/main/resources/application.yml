spring:
  application:
    name: AnipingApp

  # 외부 보안 설정 파일 로드
  config:
    import: "optional:classpath:secret.properties"

  # 1. Database 설정 (MySQL)
  datasource:
    url: jdbc:mysql://3.36.75.243:3307/aniping?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. Redis 설정 (추가됨)
  data:
    redis:
      host: 3.36.75.243
      port: 6379

  # 3. JPA/Hibernate 설정 (통합 및 정리)
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    defer-datasource-initialization: true

  # 4. Security & OAuth2 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${oauth.google.clientId}
            client-secret: ${oauth.google.secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
          kakao:
            client-id: ${oauth.kakao.clientId}
            client-secret: ${oauth.kakao.secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # 5. Mail 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: dbtmzp1@gmail.com
    password: ${google.mail.password}
    address: dbtmzp1@gmail.com
    personal: aniping
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            trust: smtp.gmail.com
    # 인증 코드 만료 시간 (30분 설정 - 필요시 조정)
    auth-code-expiration-millis: 1800000

  # 6. AWS S3 설정
  cloud:
    aws:
      credentials:
        access-key: ${aws.accessKey}
        secret-key: ${aws.secretKey}
      region:
        static: ap-northeast-2
      s3:
        bucket: anipingapp-imagestorege
      stack:
        auto: false

  # 7. 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB