spring:
  application:
    name: AnipingApp
  config:
    import: optional:classpath:secret.properties

  # ===============================
  # = Database (MySQL) 추가됨
  # ===============================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 로컬 환경 기준이며, AWS RDS 사용 시 주소를 해당 엔드포인트로 변경하세요.
    url: jdbc:mysql://localhost:3307/aniping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root        # 혹은 ${db.username}
    password: ${db.password} # secret.properties에 정의 권장

  # ===============================
  # = JPA (Hibernate)
  # ===============================
  jpa:
    hibernate:
      # 개발 초기에는 update, 운영 시에는 validate 혹은 none을 권장합니다.
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      format_sql: true
    show-sql: true
    # MySQL의 방언(Dialect)을 명시적으로 설정 (선택 사항)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true

  # ===============================
  # = AWS S3 (Spring Cloud AWS 3.x)
  # ===============================
  cloud:
    aws:
      credentials:
        access-key: ${aws.accessKey}
        secret-key: ${aws.secretKey}
      region:
        static: ap-northeast-2
      s3:
        bucket: anipingapp-imagestorege
      stack:
        auto: false

  # ===============================
  # = MAIL
  # ===============================

  mail:
    host: smtp.gmail.com
    port: 587
    username: dbtmzp1@gmail.com
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      hibernate:
        format_sql: true
    auth-code-expiration-millis: 1800000
    jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  # 파일 업로드 용량 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

